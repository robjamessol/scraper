<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Newsletter Advertiser Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        .status-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <span class="text-2xl font-bold text-primary">Newsletter Intel</span>
                    </a>
                    <div class="ml-10 flex space-x-4">
                        <a href="/" class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary">Dashboard</a>
                        <a href="/advertisers" class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary">Advertisers</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if scan_status.is_running %}
                    <span class="flex items-center text-sm text-yellow-600">
                        <span class="status-dot w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>
                        Scanning: {{ scan_status.current_newsletter }}
                    </span>
                    {% else %}
                    <span class="flex items-center text-sm text-green-600">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                        Ready
                    </span>
                    {% endif %}
                    <button onclick="startScan()"
                            class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
                            {% if scan_status.is_running %}disabled{% endif %}>
                        Run Scan
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-sm text-gray-500">
                Newsletter Advertiser Intelligence System - Renewal Weekly
            </p>
        </div>
    </footer>

    <script>
        async function startScan() {
            if (!confirm('Start a new scan? This may take several minutes.')) return;

            try {
                const res = await fetch('/api/scan', { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    alert('Scan started! The page will refresh when complete.');
                    pollStatus();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error starting scan: ' + e.message);
            }
        }

        async function pollStatus() {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();

                    if (data.status === 'idle') {
                        clearInterval(interval);
                        location.reload();
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                }
            }, 3000);
        }

        // Check if scan is running on page load
        {% if scan_status.is_running %}
        pollStatus();
        {% endif %}
    </script>
</body>
</html>

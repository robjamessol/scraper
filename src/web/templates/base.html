<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Newsletter Advertiser Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        .status-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-950 min-h-screen text-gray-100">
    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-12">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <span class="text-2xl font-bold text-primary">Newsletter Intel</span>
                    </a>
                    <div class="ml-10 flex space-x-4">
                        <a href="/" class="px-3 py-2 text-sm font-medium text-gray-300 hover:text-primary">Dashboard</a>
                        <a href="/advertisers" class="px-3 py-2 text-sm font-medium text-gray-300 hover:text-primary">Advertisers</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if scan_status.is_running %}
                    <span class="flex items-center text-sm text-yellow-400">
                        <span class="status-dot w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>
                        Scanning: {{ scan_status.current_newsletter }}
                    </span>
                    {% else %}
                    <span class="flex items-center text-sm text-green-400">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                        Ready
                    </span>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
            <p class="text-center text-sm text-gray-500">
                Newsletter Advertiser Intelligence System - Renewal Weekly
            </p>
        </div>
    </footer>

    <script>
        let logIndex = 0;
        let pollInterval = null;
        let logsMinimized = false;

        async function startScan() {
            const limitSelect = document.getElementById('scanLimit');
            const limit = limitSelect ? limitSelect.value : '25';
            const limitText = limit ? `${limit} issues` : 'all issues';

            if (!confirm(`Start a new scan (${limitText})? This may take several minutes.`)) return;

            try {
                let url = '/api/scan';
                if (limit) {
                    url += `?limit=${limit}`;
                }

                const res = await fetch(url, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        // Clear old logs
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Starting scan...</div>';
                    }

                    // Disable the scan button and show cancel button
                    const btn = document.getElementById('scanButton');
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = 'Scanning...';
                    }
                    const cancelBtn = document.getElementById('cancelButton');
                    if (cancelBtn) {
                        cancelBtn.classList.remove('hidden');
                        cancelBtn.disabled = false;
                        cancelBtn.textContent = 'Stop Scan';
                    }

                    // Start polling for updates
                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error starting scan: ' + e.message);
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            let isPolling = false;  // Prevent request pileup
            let pollCount = 0;  // Track polls for periodic stat refresh

            pollInterval = setInterval(async () => {
                if (isPolling) return;  // Skip if previous request still pending
                isPolling = true;
                pollCount++;

                try {
                    // Add timeout to prevent hanging
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const res = await fetch('/api/status', { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await res.json();

                    // Update progress bar
                    const progressBar = document.getElementById('progressBar');
                    const progressPercent = document.getElementById('progressPercent');
                    if (progressBar) progressBar.style.width = `${data.progress}%`;
                    if (progressPercent) progressPercent.textContent = `${data.progress}%`;

                    // Update stats
                    const issuesCount = document.getElementById('issuesCount');
                    const foundCount = document.getElementById('foundCount');
                    if (issuesCount) issuesCount.textContent = `${data.issues_scanned}/${data.issues_total}`;
                    if (foundCount) foundCount.textContent = data.advertisers_found;

                    // Update current action
                    const currentAction = document.getElementById('currentAction');
                    if (currentAction && data.current_action) {
                        currentAction.textContent = data.current_action;
                    }

                    // Update logs
                    if (data.logs && data.logs.length > 0) {
                        updateLogs(data.logs);
                    }

                    // Refresh dashboard stat cards every ~15s (every 10 polls)
                    if (pollCount % 10 === 0) {
                        refreshDashboardStats();
                    }

                    // Check if scan completed or was cancelled
                    if (data.status === 'idle') {
                        clearInterval(pollInterval);
                        pollInterval = null;

                        // Check if scan was cancelled vs completed normally
                        // Note: cancelled flag is reset after scan ends, so we check if the last log mentions cancellation
                        const wasCancelled = data.logs && data.logs.some(log =>
                            log.message.includes('Scan stopped by user') ||
                            log.message.includes('Cancel requested')
                        );

                        if (wasCancelled) {
                            // Add stopped message
                            addLogEntry({
                                time: new Date().toLocaleTimeString('en-US', { hour12: false }).substr(0, 8),
                                level: 'warning',
                                message: '⛔ Scan stopped - partial results saved'
                            });
                            showScanStopped();
                        } else {
                            // Add completion message
                            addLogEntry({
                                time: new Date().toLocaleTimeString('en-US', { hour12: false }).substr(0, 8),
                                level: 'info',
                                message: '✨ Scan complete!'
                            });
                            showScanComplete();
                        }
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                    // Don't stop polling on error - keep trying
                } finally {
                    isPolling = false;
                }
            }, 1500);  // Poll every 1.5s (was 1s) to reduce load
        }

        function updateLogs(logs) {
            const logOutput = document.getElementById('logOutput');
            if (!logOutput) return;

            // Only add new logs
            const newLogs = logs.slice(logIndex);
            logIndex = logs.length;

            if (newLogs.length === 0) return;

            // Clear initial message if this is the first real log
            if (logOutput.children.length === 1 && logOutput.children[0].classList.contains('text-gray-500')) {
                logOutput.innerHTML = '';
            }

            newLogs.forEach(log => addLogEntry(log));

            // Auto-scroll to bottom
            const container = document.getElementById('logsContainer');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function addLogEntry(log) {
            const logOutput = document.getElementById('logOutput');
            if (!logOutput) return;

            const entry = document.createElement('div');
            entry.className = 'flex';

            // Color based on level
            let textColor = 'text-gray-300';
            if (log.level === 'error') textColor = 'text-red-400';
            else if (log.message.includes('✅') || log.message.includes('🎉')) textColor = 'text-green-400';
            else if (log.message.includes('📰') || log.message.includes('🔍')) textColor = 'text-blue-400';
            else if (log.message.includes('Found:')) textColor = 'text-emerald-400';

            entry.innerHTML = `
                <span class="text-gray-500 mr-2 select-none">${log.time}</span>
                <span class="${textColor}">${escapeHtml(log.message)}</span>
            `;

            logOutput.appendChild(entry);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleLogs() {
            const container = document.getElementById('logsContainer');
            if (!container) return;

            logsMinimized = !logsMinimized;
            container.style.display = logsMinimized ? 'none' : 'block';
        }

        async function copyLogs() {
            try {
                const res = await fetch('/api/logs/text');
                const text = await res.text();
                await navigator.clipboard.writeText(text);
                alert('Logs copied to clipboard! (' + text.split('\n').length + ' lines)');
            } catch (e) {
                // Fallback for browsers that don't support clipboard API
                const res = await fetch('/api/logs/text');
                const text = await res.text();
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Logs copied to clipboard!');
            }
        }

        async function clearData() {
            if (!confirm('Clear all advertiser data? This cannot be undone.')) return;

            try {
                const res = await fetch('/api/advertisers/clear', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    alert('Data cleared! ' + data.message);
                    location.reload();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error clearing data: ' + e.message);
            }
        }

        async function cancelScan() {
            if (!confirm('Stop the current scan? Progress will be saved.')) return;

            try {
                const res = await fetch('/api/scan/cancel', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    // Update UI to show cancelling
                    const cancelBtn = document.getElementById('cancelButton');
                    if (cancelBtn) {
                        cancelBtn.disabled = true;
                        cancelBtn.textContent = 'Stopping...';
                    }
                    addLogEntry({
                        time: new Date().toLocaleTimeString('en-US', { hour12: false }).substr(0, 8),
                        level: 'warning',
                        message: '⛔ Cancel requested - stopping scan...'
                    });
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error cancelling scan: ' + e.message);
            }
        }

        async function refreshDashboardStats() {
            try {
                const res = await fetch('/api/dashboard-stats');
                const data = await res.json();
                const el = (id) => document.getElementById(id);
                if (el('statTotal')) el('statTotal').textContent = data.total;
                if (el('statWithEmails')) el('statWithEmails').textContent = data.with_emails;
                if (el('statWithoutEmails')) el('statWithoutEmails').textContent = data.without_emails;
                if (el('statIssuesScanned')) el('statIssuesScanned').textContent = data.scanned_issues;
            } catch (e) {
                console.error('Failed to refresh stats:', e);
            }
        }

        function showScanComplete() {
            // Update scan button to show completion state
            const btn = document.getElementById('scanButton');
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Start New Scan';
            }

            // Hide the cancel button
            const cancelBtn = document.getElementById('cancelButton');
            if (cancelBtn) {
                cancelBtn.classList.add('hidden');
            }

            // Show completion actions in the progress panel (NO auto-refresh)
            const currentAction = document.getElementById('currentAction');
            if (currentAction) {
                currentAction.innerHTML = `
                    <span class="text-green-400 font-medium">✅ Scan Complete!</span>
                    <div class="text-gray-400 text-xs mt-1">Review logs above, then refresh when ready.</div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="copyLogs()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-xs">
                            📋 Copy Logs
                        </button>
                        <button onclick="location.reload()" class="bg-primary hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs">
                            🔄 View Results
                        </button>
                    </div>
                `;
            }

            // Also update progress to 100%
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            if (progressBar) progressBar.style.width = '100%';
            if (progressPercent) progressPercent.textContent = '100%';

            // Refresh the top stat cards with live data
            refreshDashboardStats();
        }

        function showScanStopped() {
            // Update scan button to allow starting a new scan
            const btn = document.getElementById('scanButton');
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Start New Scan';
            }

            // Hide the cancel button
            const cancelBtn = document.getElementById('cancelButton');
            if (cancelBtn) {
                cancelBtn.classList.add('hidden');
            }

            // Show stopped state actions in the progress panel (NO auto-refresh)
            const currentAction = document.getElementById('currentAction');
            if (currentAction) {
                currentAction.innerHTML = `
                    <span class="text-yellow-400 font-medium">⛔ Scan Stopped</span>
                    <div class="text-gray-400 text-xs mt-1">Partial results saved. Review logs above.</div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="copyLogs()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-xs">
                            📋 Copy Logs
                        </button>
                        <button onclick="location.reload()" class="bg-primary hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs">
                            🔄 View Results
                        </button>
                        <button onclick="retryFailed()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-1 rounded text-xs">
                            🔁 Retry Failed
                        </button>
                    </div>
                `;
            }

            // Refresh the top stat cards with live data
            refreshDashboardStats();
        }

        // Auto-refresh countdown
        let autoRefreshTimer = null;
        let countdownTimer = null;

        function startAutoRefreshCountdown(seconds) {
            let remaining = seconds;
            const countdownEl = document.getElementById('refreshCountdown');

            // Update countdown every second
            countdownTimer = setInterval(() => {
                remaining--;
                if (countdownEl) countdownEl.textContent = remaining;
            }, 1000);

            // Refresh after countdown
            autoRefreshTimer = setTimeout(() => {
                clearInterval(countdownTimer);
                location.reload();
            }, seconds * 1000);
        }

        function cancelAutoRefresh() {
            if (autoRefreshTimer) {
                clearTimeout(autoRefreshTimer);
                autoRefreshTimer = null;
            }
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            const countdownEl = document.getElementById('refreshCountdown');
            if (countdownEl) {
                countdownEl.parentElement.textContent = 'Auto-refresh cancelled';
            }
        }

        // Check if scan is running on page load
        {% if scan_status.is_running %}
        startPolling();
        {% endif %}

        // ===== Retry Queue Functions =====
        async function loadRetryQueue() {
            try {
                const res = await fetch('/api/retry-queue');
                const data = await res.json();
                const countEl = document.getElementById('retryCount');
                if (countEl) countEl.textContent = data.count;
                return data;
            } catch (e) {
                console.error('Error loading retry queue:', e);
                return { count: 0, domains: [] };
            }
        }

        async function retryFailed() {
            const data = await loadRetryQueue();
            if (data.count === 0) {
                alert('No failed domains to retry!');
                return;
            }

            if (!confirm(`Retry ${data.count} failed domains?`)) return;

            try {
                const res = await fetch('/api/retry-queue/run', { method: 'POST' });
                const result = await res.json();

                if (res.ok) {
                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Starting retry...</div>';
                    }

                    // Disable buttons
                    const btn = document.getElementById('retryButton');
                    if (btn) btn.disabled = true;
                    const scanBtn = document.getElementById('scanButton');
                    if (scanBtn) scanBtn.disabled = true;

                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (e) {
                alert('Error starting retry: ' + e.message);
            }
        }

        // ===== Newsletter Source Functions =====
        async function loadNewsletterSources() {
            try {
                const res = await fetch('/api/newsletter-sources');
                const data = await res.json();
                const listEl = document.getElementById('newsletterSourcesList');
                if (listEl && data.sources) {
                    if (data.sources.length === 0) {
                        listEl.innerHTML = '<p class="text-gray-500 text-sm">No newsletters scanned yet</p>';
                    } else {
                        listEl.innerHTML = data.sources.map(s => `
                            <div class="flex items-center justify-between bg-gray-800 px-3 py-1.5 rounded text-sm">
                                <div>
                                    <span class="text-gray-200">${escapeHtml(s.name)}</span>
                                    <span class="text-gray-500 ml-2">${escapeHtml(s.domain)}</span>
                                    ${s.last_scanned ? '<span class="text-green-500 ml-1">&#10003;</span>' : ''}
                                    ${s.total_issues_found ? '<span class="text-gray-500 ml-2">' + s.total_issues_found + ' issues</span>' : ''}
                                    ${s.total_sponsors_found ? '<span class="text-gray-500 ml-1">' + s.total_sponsors_found + ' sponsors</span>' : ''}
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="rescanNewsletter('${s.domain}')" class="text-indigo-400 hover:text-indigo-300 text-xs">rescan</button>
                                    <button onclick="removeNewsletterSource('${s.domain}')" class="text-red-400 hover:text-red-300 text-xs">&#10005;</button>
                                </div>
                            </div>
                        `).join('');
                    }
                }
                return data;
            } catch (e) {
                console.error('Error loading newsletter sources:', e);
                return { count: 0, sources: [] };
            }
        }

        async function scanNewsletter() {
            const urlInput = document.getElementById('newsletterUrl');
            const nameInput = document.getElementById('newsletterName');
            const limitInput = document.getElementById('newsletterLimit');
            const url = urlInput.value.trim();
            const name = nameInput.value.trim();
            const limit = parseInt(limitInput.value) || 10;

            if (!url) {
                alert('Please enter a newsletter URL');
                return;
            }

            const btn = document.getElementById('scanNewsletterBtn');
            btn.disabled = true;
            btn.textContent = 'Starting...';

            try {
                const res = await fetch('/api/newsletter-sources/add-and-scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, name: name || null, limit })
                });
                const data = await res.json();

                if (res.ok) {
                    urlInput.value = '';
                    nameInput.value = '';
                    loadNewsletterSources();

                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">' + escapeHtml(data.message) + '</div>';
                    }
                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Scan';
            }
        }

        async function rescanNewsletter(domain) {
            if (scanStatus === 'running') {
                alert('A scan is already running');
                return;
            }
            try {
                const res = await fetch(`/api/newsletter-sources/${encodeURIComponent(domain)}/scan`, { method: 'POST' });
                if (res.ok) {
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Rescanning ' + domain + '...</div>';
                    }
                    logIndex = 0;
                    startPolling();
                } else {
                    const data = await res.json();
                    alert('Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        async function removeNewsletterSource(domain) {
            try {
                await fetch(`/api/newsletter-sources/${encodeURIComponent(domain)}`, { method: 'DELETE' });
                loadNewsletterSources();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // ===== Custom Company Domain Functions =====
        async function loadCustomDomains() {
            try {
                const res = await fetch('/api/custom-domains');
                const data = await res.json();
                const listEl = document.getElementById('customDomainsList');
                if (listEl && data.domains) {
                    if (data.domains.length === 0) {
                        listEl.innerHTML = '<p class="text-gray-500 text-sm">No company domains scanned yet</p>';
                    } else {
                        listEl.innerHTML = data.domains.map(d => `
                            <div class="flex items-center justify-between bg-gray-800 px-3 py-1.5 rounded text-sm">
                                <div>
                                    <span class="text-gray-200">${escapeHtml(d.domain)}</span>
                                    <span class="text-gray-500 ml-2">${escapeHtml(d.company_name)}</span>
                                    ${d.scanned ? '<span class="text-green-500 ml-2">&#10003;</span>' : ''}
                                </div>
                                <button onclick="removeCustomDomain('${d.domain}')" class="text-red-400 hover:text-red-300 text-xs">&#10005;</button>
                            </div>
                        `).join('');
                    }
                }
                return data;
            } catch (e) {
                console.error('Error loading custom domains:', e);
                return { count: 0, domains: [] };
            }
        }

        async function addCustomDomain() {
            const domainInput = document.getElementById('customDomain');
            const companyInput = document.getElementById('customCompany');
            const domain = domainInput.value.trim();
            const company = companyInput.value.trim();

            if (!domain) {
                alert('Please enter a domain');
                return;
            }

            try {
                const res = await fetch('/api/custom-domains', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, company_name: company || null })
                });
                const data = await res.json();

                if (res.ok) {
                    domainInput.value = '';
                    companyInput.value = '';
                    loadCustomDomains();

                    // Auto-scan this single domain for contacts
                    const addedDomain = data.domain;
                    const scanRes = await fetch(`/api/custom-domains/${encodeURIComponent(addedDomain)}/scan`, { method: 'POST' });
                    if (scanRes.ok) {
                        const panel = document.getElementById('progressPanel');
                        if (panel) {
                            panel.classList.remove('hidden');
                            const logOutput = document.getElementById('logOutput');
                            if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Scanning ' + addedDomain + ' for contacts...</div>';
                        }
                        logIndex = 0;
                        startPolling();
                    }
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error adding domain: ' + e.message);
            }
        }

        async function removeCustomDomain(domain) {
            try {
                await fetch(`/api/custom-domains/${encodeURIComponent(domain)}`, { method: 'DELETE' });
                loadCustomDomains();
            } catch (e) {
                alert('Error removing domain: ' + e.message);
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadRetryQueue();
            loadCustomDomains();
            loadNewsletterSources();
        });
    </script>
</body>
</html>

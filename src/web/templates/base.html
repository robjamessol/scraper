<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Newsletter Advertiser Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        .status-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-950 min-h-screen text-gray-100">
    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-12">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <span class="text-2xl font-bold text-primary">Newsletter Intel</span>
                    </a>
                    <div class="ml-10 flex space-x-4">
                        <a href="/" class="px-3 py-2 text-sm font-medium text-gray-300 hover:text-primary">Dashboard</a>
                        <a href="/advertisers" class="px-3 py-2 text-sm font-medium text-gray-300 hover:text-primary">Advertisers</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if scan_status.is_running %}
                    <span class="flex items-center text-sm text-yellow-400">
                        <span class="status-dot w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>
                        Scanning: {{ scan_status.current_newsletter }}
                    </span>
                    {% else %}
                    <span class="flex items-center text-sm text-green-400">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                        Ready
                    </span>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
            <p class="text-center text-sm text-gray-500">
                Newsletter Advertiser Intelligence System - Renewal Weekly
            </p>
        </div>
    </footer>

    <script>
        let logIndex = 0;
        let pollInterval = null;
        let logsMinimized = false;

        async function startScan() {
            const limitSelect = document.getElementById('scanLimit');
            const limit = limitSelect ? limitSelect.value : '25';
            const limitText = limit ? `${limit} issues` : 'all issues';

            if (!confirm(`Start a new scan (${limitText})? This may take several minutes.`)) return;

            try {
                let url = '/api/scan';
                if (limit) {
                    url += `?limit=${limit}`;
                }

                const res = await fetch(url, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        // Clear old logs
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Starting scan...</div>';
                    }

                    // Disable the scan button and show cancel button
                    const btn = document.getElementById('scanButton');
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = 'Scanning...';
                    }
                    const cancelBtn = document.getElementById('cancelButton');
                    if (cancelBtn) {
                        cancelBtn.classList.remove('hidden');
                        cancelBtn.disabled = false;
                        cancelBtn.textContent = 'Stop Scan';
                    }

                    // Start polling for updates
                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error starting scan: ' + e.message);
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            let isPolling = false;  // Prevent request pileup

            pollInterval = setInterval(async () => {
                if (isPolling) return;  // Skip if previous request still pending
                isPolling = true;

                try {
                    // Add timeout to prevent hanging
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const res = await fetch('/api/status', { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await res.json();

                    // Update progress bar
                    const progressBar = document.getElementById('progressBar');
                    const progressPercent = document.getElementById('progressPercent');
                    if (progressBar) progressBar.style.width = `${data.progress}%`;
                    if (progressPercent) progressPercent.textContent = `${data.progress}%`;

                    // Update stats
                    const issuesCount = document.getElementById('issuesCount');
                    const foundCount = document.getElementById('foundCount');
                    if (issuesCount) issuesCount.textContent = `${data.issues_scanned}/${data.issues_total}`;
                    if (foundCount) foundCount.textContent = data.advertisers_found;

                    // Update current action
                    const currentAction = document.getElementById('currentAction');
                    if (currentAction && data.current_action) {
                        currentAction.textContent = data.current_action;
                    }

                    // Update logs
                    if (data.logs && data.logs.length > 0) {
                        updateLogs(data.logs);
                    }

                    // Check if scan completed
                    if (data.status === 'idle') {
                        clearInterval(pollInterval);
                        pollInterval = null;

                        // Add completion message
                        addLogEntry({
                            time: new Date().toLocaleTimeString('en-US', { hour12: false }).substr(0, 8),
                            level: 'info',
                            message: '✨ Scan complete!'
                        });

                        // Show completion buttons instead of auto-reload
                        showScanComplete();
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                    // Don't stop polling on error - keep trying
                } finally {
                    isPolling = false;
                }
            }, 1500);  // Poll every 1.5s (was 1s) to reduce load
        }

        function updateLogs(logs) {
            const logOutput = document.getElementById('logOutput');
            if (!logOutput) return;

            // Only add new logs
            const newLogs = logs.slice(logIndex);
            logIndex = logs.length;

            if (newLogs.length === 0) return;

            // Clear initial message if this is the first real log
            if (logOutput.children.length === 1 && logOutput.children[0].classList.contains('text-gray-500')) {
                logOutput.innerHTML = '';
            }

            newLogs.forEach(log => addLogEntry(log));

            // Auto-scroll to bottom
            const container = document.getElementById('logsContainer');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function addLogEntry(log) {
            const logOutput = document.getElementById('logOutput');
            if (!logOutput) return;

            const entry = document.createElement('div');
            entry.className = 'flex';

            // Color based on level
            let textColor = 'text-gray-300';
            if (log.level === 'error') textColor = 'text-red-400';
            else if (log.message.includes('✅') || log.message.includes('🎉')) textColor = 'text-green-400';
            else if (log.message.includes('📰') || log.message.includes('🔍')) textColor = 'text-blue-400';
            else if (log.message.includes('Found:')) textColor = 'text-emerald-400';

            entry.innerHTML = `
                <span class="text-gray-500 mr-2 select-none">${log.time}</span>
                <span class="${textColor}">${escapeHtml(log.message)}</span>
            `;

            logOutput.appendChild(entry);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleLogs() {
            const container = document.getElementById('logsContainer');
            if (!container) return;

            logsMinimized = !logsMinimized;
            container.style.display = logsMinimized ? 'none' : 'block';
        }

        async function copyLogs() {
            try {
                const res = await fetch('/api/logs/text');
                const text = await res.text();
                await navigator.clipboard.writeText(text);
                alert('Logs copied to clipboard! (' + text.split('\n').length + ' lines)');
            } catch (e) {
                // Fallback for browsers that don't support clipboard API
                const res = await fetch('/api/logs/text');
                const text = await res.text();
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Logs copied to clipboard!');
            }
        }

        async function clearData() {
            if (!confirm('Clear all advertiser data? This cannot be undone.')) return;

            try {
                const res = await fetch('/api/advertisers/clear', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    alert('Data cleared! ' + data.message);
                    location.reload();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error clearing data: ' + e.message);
            }
        }

        async function cancelScan() {
            if (!confirm('Stop the current scan? Progress will be saved.')) return;

            try {
                const res = await fetch('/api/scan/cancel', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    // Update UI to show cancelling
                    const cancelBtn = document.getElementById('cancelButton');
                    if (cancelBtn) {
                        cancelBtn.disabled = true;
                        cancelBtn.textContent = 'Stopping...';
                    }
                    addLogEntry({
                        time: new Date().toLocaleTimeString('en-US', { hour12: false }).substr(0, 8),
                        level: 'warning',
                        message: '⛔ Cancel requested - stopping scan...'
                    });
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error cancelling scan: ' + e.message);
            }
        }

        function showScanComplete() {
            // Update scan button to show completion state
            const btn = document.getElementById('scanButton');
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Start New Scan';
            }

            // Hide the cancel button
            const cancelBtn = document.getElementById('cancelButton');
            if (cancelBtn) {
                cancelBtn.classList.add('hidden');
            }

            // Show completion actions in the progress panel
            const currentAction = document.getElementById('currentAction');
            if (currentAction) {
                currentAction.innerHTML = `
                    <span class="text-green-400 font-medium">✅ Scan Complete!</span>
                    <div class="flex gap-2 mt-2">
                        <button onclick="copyLogs()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-xs">
                            📋 Copy Logs
                        </button>
                        <button onclick="location.reload()" class="bg-primary hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs">
                            🔄 View Results
                        </button>
                    </div>
                `;
            }

            // Also update progress to 100%
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            if (progressBar) progressBar.style.width = '100%';
            if (progressPercent) progressPercent.textContent = '100%';
        }

        // Check if scan is running on page load
        {% if scan_status.is_running %}
        startPolling();
        {% endif %}

        // ===== Retry Queue Functions =====
        async function loadRetryQueue() {
            try {
                const res = await fetch('/api/retry-queue');
                const data = await res.json();
                const countEl = document.getElementById('retryCount');
                if (countEl) countEl.textContent = data.count;
                return data;
            } catch (e) {
                console.error('Error loading retry queue:', e);
                return { count: 0, domains: [] };
            }
        }

        async function retryFailed() {
            const data = await loadRetryQueue();
            if (data.count === 0) {
                alert('No failed domains to retry!');
                return;
            }

            if (!confirm(`Retry ${data.count} failed domains?`)) return;

            try {
                const res = await fetch('/api/retry-queue/run', { method: 'POST' });
                const result = await res.json();

                if (res.ok) {
                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Starting retry...</div>';
                    }

                    // Disable buttons
                    const btn = document.getElementById('retryButton');
                    if (btn) btn.disabled = true;
                    const scanBtn = document.getElementById('scanButton');
                    if (scanBtn) scanBtn.disabled = true;

                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (e) {
                alert('Error starting retry: ' + e.message);
            }
        }

        // ===== Custom Domains Functions =====
        async function loadCustomDomains() {
            try {
                const res = await fetch('/api/custom-domains');
                const data = await res.json();
                const listEl = document.getElementById('customDomainsList');
                if (listEl && data.domains) {
                    if (data.domains.length === 0) {
                        listEl.innerHTML = '<p class="text-gray-500 text-sm">No custom domains added yet</p>';
                    } else {
                        listEl.innerHTML = data.domains.map(d => `
                            <div class="flex items-center justify-between bg-gray-800 px-3 py-1.5 rounded text-sm">
                                <div>
                                    <span class="text-gray-200">${escapeHtml(d.domain)}</span>
                                    <span class="text-gray-500 ml-2">${escapeHtml(d.company_name)}</span>
                                    ${d.scanned ? '<span class="text-green-500 ml-2">✓</span>' : ''}
                                </div>
                                <button onclick="removeCustomDomain('${d.domain}')" class="text-red-400 hover:text-red-300 text-xs">✕</button>
                            </div>
                        `).join('');
                    }
                }
                return data;
            } catch (e) {
                console.error('Error loading custom domains:', e);
                return { count: 0, domains: [] };
            }
        }

        async function addCustomDomain() {
            const domainInput = document.getElementById('customDomain');
            const companyInput = document.getElementById('customCompany');
            const domain = domainInput.value.trim();
            const company = companyInput.value.trim();

            if (!domain) {
                alert('Please enter a domain');
                return;
            }

            try {
                const res = await fetch('/api/custom-domains', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, company_name: company || null })
                });
                const data = await res.json();

                if (res.ok) {
                    domainInput.value = '';
                    companyInput.value = '';
                    loadCustomDomains();
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (e) {
                alert('Error adding domain: ' + e.message);
            }
        }

        async function removeCustomDomain(domain) {
            try {
                await fetch(`/api/custom-domains/${encodeURIComponent(domain)}`, { method: 'DELETE' });
                loadCustomDomains();
            } catch (e) {
                alert('Error removing domain: ' + e.message);
            }
        }

        async function scanCustomDomains() {
            const data = await loadCustomDomains();
            const unscanned = data.domains.filter(d => !d.scanned);

            if (unscanned.length === 0) {
                alert('All custom domains have been scanned!');
                return;
            }

            if (!confirm(`Scan ${unscanned.length} custom domain(s)?`)) return;

            try {
                const res = await fetch('/api/custom-domains/scan', { method: 'POST' });
                const result = await res.json();

                if (res.ok) {
                    // Show progress panel
                    const panel = document.getElementById('progressPanel');
                    if (panel) {
                        panel.classList.remove('hidden');
                        const logOutput = document.getElementById('logOutput');
                        if (logOutput) logOutput.innerHTML = '<div class="text-gray-500">Starting custom scan...</div>';
                    }

                    logIndex = 0;
                    startPolling();
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (e) {
                alert('Error starting scan: ' + e.message);
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadRetryQueue();
            loadCustomDomains();
        });
    </script>
</body>
</html>
